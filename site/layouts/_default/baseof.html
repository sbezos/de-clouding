<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232a6f97'/%3E%3Cpath d='M9 19h14a4 4 0 0 0 0-8 6 6 0 0 0-11-1 5 5 0 0 0-3 9z' fill='%23fff'/%3E%3Cpath d='M8 24l16-16' stroke='%23e07a5f' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ "/" | relURL }}">de-clouding<span>.com</span></a>
  <nav>
    {{ range site.Menus.main }}
    <a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} class="active"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
<main>
  {{ block "main" . }}{{ end }}
</main>
<footer class="site-footer">
  <p>No ads, no affiliate links, no analytics, no backend. Nothing you type on this site leaves your browser.</p>
  <p>Text is <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>. Copy it, improve it, pass it on.</p>
</footer>
<script src="{{ "js/copy.js" | relURL }}" defer></script>
{{ block "scripts" . }}{{ end }}
</body>
</html>
