# de-clouding.com kit: the family's own Minecraft (Java) server, friends-only from the first boot
# Add a friend later:  docker compose exec minecraft rcon-cli whitelist add TheirName
services:
  minecraft:
    image: itzg/minecraft-server
    container_name: minecraft
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      - EULA=TRUE                 # you accept Minecraft's EULA by setting this
      - TYPE=PAPER
      - MEMORY=2G
      - ONLINE_MODE=TRUE
      - ENFORCE_WHITELIST=TRUE
      - WHITELIST=KidOne,KidTwo   # Minecraft usernames, comma-separated
      - DIFFICULTY=normal
      - MOTD=Our house. Friends only.
    volumes:
      - ./minecraft:/data
    ports:
      - "25565:25565"
