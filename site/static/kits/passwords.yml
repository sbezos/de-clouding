# de-clouding.com kit: passwords (Vaultwarden, speaks the Bitwarden protocol)
# Browser extensions need HTTPS: reach this through `tailscale serve` (see the page)
# and set DOMAIN to that https:// address before you create your account.
services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - DOMAIN=https://CHANGE-ME.your-tailnet.ts.net:8443
      - SIGNUPS_ALLOWED=true        # set to false after everyone in the house has an account
    volumes:
      - ./vaultwarden:/data
    ports:
      - "8080:80"
