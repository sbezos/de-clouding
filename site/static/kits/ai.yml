# de-clouding.com kit: your own AI assistant (Ollama + Open WebUI), CPU only
# After it starts, pull a small model:  docker compose exec ollama ollama pull qwen3:4b
# (ask any assistant for a current 3–4B model name; they change monthly). Expect a few words per second on a mini PC.
services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ./ollama:/root/.ollama
    ports:
      - "11434:11434"
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./open-webui:/app/backend/data
    ports:
      - "3001:8080"
    depends_on:
      - ollama
