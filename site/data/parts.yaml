# Curated hardware for the "Build a box" and "Budget tiers" pages.
#
# Hand-maintained. `about` is a rough US-dollar price (used or refurbished unless the note says to buy
# new); `as_of` dates the whole file. Re-check by hand a few times a year and bump `as_of`.
# No feeds, no scraping, no links, no affiliate anything — the site earns nothing. (Live marketplace
# data was considered and dropped: the big marketplace's API terms forbid using its data to suggest
# prices, and the site wouldn't want to depend on one anyway.)
# `mine: true` marks gear the author actually runs; it is rendered as such, not as a recommendation.

as_of: "2026-10-26"

tiers:
  t1:
    title: "Tier 1 — one small always-on box"
    parts: [t1-optiplex-micro, t1-thinkcentre-tiny, t1-elitedesk-mini, t1-n100-mini, t1-pi5-8gb, t1-usb-4tb, t1-zigbee]
  t2:
    title: "Tier 2 — a real home server"
    parts: [t2-macmini-m4-24, t2-minipc-64gb, t2-nas-2bay, t2-nas-4bay, t2-workstation, t2-hdd-8tb, t2-ram-ddr4-32]
  t3:
    title: "Tier 3 — the hobby got serious"
    parts: [t3-rtx-3060-12, t3-rtx-3090, t3-rtx-a4000, t3-r740, t3-nvme-2tb, t3-ups-1500]

parts:
  # ---------- Tier 1 ----------
  t1-optiplex-micro:
    name: "Dell OptiPlex Micro — i5, 16 GB, SSD"
    note: "7060/7070/7080 (8th–10th gen). One litre, 8–12 W idle, QuickSync for video."
    about: 150
  t1-thinkcentre-tiny:
    name: "Lenovo ThinkCentre M720q Tiny — 16 GB"
    note: "Same idea as the OptiPlex; M920q and M70q are the siblings."
    about: 150
  t1-elitedesk-mini:
    name: "HP EliteDesk 800 G4 Mini — 16 GB"
    note: "G4 or G5. The three 1-litre lines are interchangeable; buy whichever is cheapest when you look."
    about: 150
  t1-n100-mini:
    name: "Mini PC, Intel N100/N150, 16 GB"
    note: "Current, often fanless, 7–10 W idle. New is fine here; there's little used stock."
    about: 180
  t1-pi5-8gb:
    name: "Raspberry Pi 5, 8 GB"
    note: "Buy new. Board only — add the official power supply and an NVMe HAT or a USB SSD, never a microSD."
    about: 95
  t1-usb-4tb:
    name: "External USB drive, 4 TB"
    note: "Buy new. Photos, media and the backup staging area. One drive plus an off-site backup is Tier-1 honest."
    about: 100
  t1-zigbee:
    name: "Zigbee USB stick (Sonoff Dongle Plus)"
    note: "Buy new. Only if you'll do the smart-home kit."
    about: 30

  # ---------- Tier 2 ----------
  t2-macmini-m4-24:
    name: "Mac mini M4, 24 GB"
    note: "Unified memory makes it a quiet, tiny box for 8–14B models. Used and refurbished both fine."
    about: 700
  t2-minipc-64gb:
    name: "Mini PC, Ryzen 7, 64 GB"
    note: "The x86 alternative: more software, more RAM, a little more power."
    about: 550
  t2-nas-2bay:
    name: "Synology DS224+ (2-bay NAS)"
    note: "The storage half of Tier 2. UGREEN and QNAP 2-bays are equivalents. Drives sold separately."
    about: 300
  t2-nas-4bay:
    name: "Synology DS923+ (4-bay NAS)"
    note: "If photos and media will outgrow two drives."
    about: 550
  t2-workstation:
    name: "Dell Precision 3650 Tower — i7"
    note: "PCIe slots and drive bays: the upgrade path to Tier 3 without buying twice."
    about: 400
  t2-hdd-8tb:
    name: "NAS hard drive, 8 TB (Seagate IronWolf)"
    note: "Two for a mirror. WD Red Plus is the equivalent. Buy new or manufacturer-recertified for drives."
    about: 160
  t2-ram-ddr4-32:
    name: "32 GB DDR4-3200 SO-DIMM"
    note: "Takes a 16 GB mini PC to 32–48 GB for a bigger model or more containers. Memory prices are volatile right now — see [Buying used](/tiers/#buying-used)."
    about: 60

  # ---------- Tier 3 ----------
  t3-rtx-3060-12:
    name: "NVIDIA RTX 3060, 12 GB"
    note: "The budget inference card: 12 GB runs 7–14B models comfortably and draws little."
    about: 230
  t3-rtx-3090:
    name: "NVIDIA RTX 3090, 24 GB"
    note: "The value standard for 27–32B models; two for 70B-class at 4-bit. Mind heat and noise."
    about: 720
  t3-rtx-a4000:
    name: "NVIDIA RTX A4000, 16 GB"
    note: "Single-slot, 140 W, workstation-quiet; fits in cases and power budgets a 3090 won't."
    about: 800
  t3-r740:
    name: "Dell PowerEdge R740 (2× Xeon Gold)"
    note: "This is what I run, and it is not a typical home recommendation: a rack server, loud, hungry, and happiest in a basement or garage. It is where the lab notes come from."
    mine: true
    about: 1400
  t3-nvme-2tb:
    name: "NVMe SSD, 2 TB, Gen4"
    note: "Buy new. Model storage: a model file loads from NVMe in seconds, from a hard drive in minutes."
    about: 130
  t3-ups-1500:
    name: "UPS, 1,500 VA pure sine (CyberPower CP1500PFCLCD)"
    note: "Any 1,000–1,500 VA pure-sine unit with USB, so the box shuts down cleanly on its own. A used one needs a new battery."
    about: 180
